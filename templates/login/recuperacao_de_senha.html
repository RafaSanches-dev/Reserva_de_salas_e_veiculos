<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename = 'css/componentes.css' )}}">
</head>
<body>

<header class="top-bar">
    <h1>Recuperação de senha</h1>
</header>

<img src="{{ url_for('static', filename = 'imagens/Logo_UEMG.png' )}}" class="Logo_UEMG">

<div class="container">
    <div class="card">
        <h2>Recuperar acesso</h2>

        <p class="descricao">Informe seu email e enviaremos instruções para redefinir sua senha.</p>

        <label>Email cadastrado:</label>
        <input type="email" class="input">

        <button class="btn" onclick="">Enviar código</button>

        <div class="login-links">
            <a href="{{ url_for('login') }}">Voltar ao login</a>
        </div>
    </div>
</div>

</body>
</html>
